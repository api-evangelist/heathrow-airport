- aid: heathrow-airport:heathrow-weather-api
  name: Heathrow Weather API
  description: Heathrow's Weather API provides up to date information on weather
    conditions at most airports worldwide, exposing temperature, weather categories,
    a countries list and lookup of weather by IATA code, positioned as a companion to
    the Flights API for connection and arrival/departure context. Described publicly
    on the Heathrow developer portal; the endpoint reference and machine-readable
    contract are visible only to enrolled, Azure AD authenticated accounts.
  humanURL: https://developer.heathrow.com/api-weather
  baseURL: https://api.heathrow.com/
