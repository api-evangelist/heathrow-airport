name: Heathrow Airport
kind: company
humanURL: https://www.heathrow.com/
description: Heathrow Airport Limited operates London Heathrow (IATA LHR, ICAO EGLL),
  the United Kingdom's principal international hub and Europe's busiest airport by
  passenger numbers, under the ultimate ownership of FGP Topco Limited - whose largest
  shareholder since December 2024 is Ardian, alongside Saudi Arabia's Public Investment
  Fund and a residual Ferrovial holding. In the travel distribution chain Heathrow is
  infrastructure, not an intermediary - it sells no seats, holds no bookable inventory,
  issues no PNRs or e-tickets, and sits entirely outside the GDS and IATA NDC value
  chain, earning aeronautical charges, retail concessions, car parking and property
  income instead. Its API posture is unusual for an airport - Heathrow does run a real,
  branded, publicly reachable developer portal at developer.heathrow.com, built on
  Microsoft Azure API Management, which publicly describes three products in prose -
  Flights, Flight Connections and Weather - but publishes no OpenAPI, no endpoint
  reference, no rate limits, no pricing and no SLA to anonymous visitors. The API
  catalogue and Products list return empty to unauthenticated callers, sign-in is via
  Azure Active Directory, and the portal's own How It Works page requires a prospective
  developer to email support@heathrow.com and be enrolled before any access is granted.
  The gateway at api.heathrow.com goes further and rejects requests with "400 No
  required SSL certificate was sent", meaning mutual TLS with a Heathrow-issued client
  certificate. So - public docs, gated contracts, no exit path beyond a UK GDPR data
  portability request to privacy@heathrow.com.
