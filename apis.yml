apis:
- aid: heathrow-airport:heathrow-flights-api
  name: Heathrow Flights API
  description: Heathrow's Flights API provides up to date information on real time
    flights to and from Heathrow, covering destinations, arrivals, airlines, aircraft
    types, flight status, gates and terminals, with scheduled flight information
    enriched by real-time gate and terminal updates. Described publicly on the Heathrow
    developer portal; the endpoint reference and machine-readable contract are visible
    only to enrolled, Azure AD authenticated accounts.
  humanURL: https://developer.heathrow.com/api-flights
  baseURL: https://api.heathrow.com/
  tags:
  - Flights
