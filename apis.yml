- aid: heathrow-airport:heathrow-connections-api
  name: Heathrow Flight Connections API
  description: Heathrow's Connections API provides up to date information on real time
    flight connections to and from Heathrow, returning connection information together
    with flight detail. The portal documents four query shapes - flight to flight,
    flight to terminal, terminal to terminal, and terminal to flight. Described
    publicly on the Heathrow developer portal; the endpoint reference and
    machine-readable contract are visible only to enrolled, Azure AD authenticated
    accounts.
  humanURL: https://developer.heathrow.com/api-connections
  baseURL: https://api.heathrow.com/
  tags:
