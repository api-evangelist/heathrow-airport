  reason: |
    Three APIs are listed because Heathrow publicly documents three named API products
    on its own developer portal - Flights, Connections and Weather - each with a stable
    public page describing what the API returns. That clears the bar of real AND
    documented. No baseURL is asserted for any of them, because Heathrow never publishes
    one; api.heathrow.com is the observed gateway host but no Heathrow document names it
    as the base URL for these products, and it rejects every request without a client
    certificate.

    The undocumented api-dp-prod.dp.heathrow.com backend is deliberately excluded from
    apis.yml. Its route names mirror the portal products, it is clearly the same
    platform, and it is real - but it is unversioned, uncontracted, key-gated and
    unpublished, and the website terms forbid the systematic extraction it would enable.
    Listing it would misrepresent a private website backend as a product.
