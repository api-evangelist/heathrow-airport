aid: heathrow-airport
name: Heathrow Airport
review:
  question: Does Heathrow Airport publish a public developer portal, documented APIs,
    and a machine-readable API contract - and what would it cost a consumer to leave?
  answer: partial
  date: '2026-07-28'
  reviewer: API Evangelist
  method: direct HTTP probing of heathrow.com, developer.heathrow.com, api.heathrow.com,
    the Azure API Management portal sitemap and its management endpoint, the website's
    own backend hosts, robots.txt, sitemaps, terms and privacy notices
findings:
  summary: |
    Heathrow Airport Limited operates a real, branded, publicly reachable developer
    portal at https://developer.heathrow.com - a Microsoft Azure API Management
    developer portal (page titles still carry the stock "Microsoft Azure API Management
    - developer portal" suffix) fronted by an Azure Front Door. It returned HTTP 200 on
    2026-07-28. This puts Heathrow ahead of most airport operators, which publish
    nothing at all.

    The portal publicly documents three API products in prose, each on its own page:
    Flights (/api-flights), Flight Connections (/api-connections) and Weather
    (/api-weather). Those pages name the data each API returns - destinations,
    arrivals, airlines, aircraft types, flight status, gates and terminals for Flights;
    flight-to-flight, flight-to-terminal, terminal-to-terminal and terminal-to-flight
    queries for Connections; temperature, weather categories, countries list and
    weather-by-IATA-code for Weather. That is the entire public technical surface.

    Nothing machine-readable is published. /apis and /products both return HTTP 200 but
    render an empty list. The portal's own configuration document at
    https://developer.heathrow.com/config.json (HTTP 200) discloses the backing
    management endpoint -
    https://apimgmt.lhr.aero/subscriptions/000/resourceGroups/000/providers/Microsoft.ApiManagement/service/apim-halcomcommon-prod-westeu-001,
    api-version 2022-04-01-preview. Queried anonymously, that endpoint returns
    {"value":[],"count":0} for /apis, /products, /apiVersionSets and /tags, and HTTP
    401 for /identityProviders, /groups, /namedValues and every /portalsettings path.
    The API catalogue is therefore visible only after authentication. No OpenAPI,
    Swagger, AsyncAPI, GraphQL, Postman collection or JSON Schema is retrievable
    anonymously anywhere on either heathrow.com or developer.heathrow.com.

    Access is explicitly gated by human approval. The portal's own How It Works page
    states it plainly: "In order to get the access to our APIs you need to get a
    personal account or an account for you team, for security and privacy reasons
    before we grant you access to the APIs, we need to know what type of user you are
    and why you want to use the APIs." It directs applicants to support@heathrow.com
    or 08443351801, then to an "enrolling process", after which "you'll be able to
    access using the Microsoft active directory". The sign-in page confirms: "Sign in
    using your Azure Active Directory credentials." A /signup page exists but offers no
    self-serve registration form to an anonymous visitor.

    The runtime gate is stronger still. https://api.heathrow.com/ and every path probed
    beneath it return HTTP 400 from Microsoft-Azure-Application-Gateway/v2 with the
    body "400 No required SSL certificate was sent" - the gateway enforces mutual TLS
    and demands a Heathrow-issued client certificate. The portal sitemap corroborates
    this with an entry for /documentation/requesting-a-client-certificate, though that
    page itself now returns HTTP 404 - documented process, broken document.

    Separately, the public heathrow.com website is backed by an entirely undocumented
    API estate on api-dp-prod.dp.heathrow.com, discovered in the page source of
    https://www.heathrow.com/arrivals. It includes /pihub/flights/arrivals,
    /pihub/flights/departures, /pihub/flights/timetable, /pihub/flightconnections/,
    /pihub/weather/forecasts/, /pihub/securitywaittime, /pihub/immigrationwaittime,
    /pihub/poi, /journey/api/v1/travel/ride, /enterprisesearch/prod/odata/flights and
    third-party passthroughs to National Rail and TransportAPI. Every one of these
    returned HTTP 403 {"message":"Forbidden"} to an unauthenticated probe - they require
    a key that is never exposed to the browser. Notably the /pihub/ path names mirror
    the three portal products exactly, which suggests the portal APIs and the website
    backend are the same platform behind different gates. These are deliberately NOT
    listed in apis.yml: they are undocumented, unversioned website backends with no
    published contract.

    Heathrow is not part of the travel distribution chain in the intermediation sense.
    It sells no seats, holds no bookable inventory, files no fares, issues no PNRs or
    e-tickets, holds no IATA/ARC accreditation relationship with agencies, and has no
    GDS or IATA NDC posture whatsoever. Slot allocation at LHR sits with Airport
    Coordination Limited, not with Heathrow and not with a distribution system.
    Distribution model is not-applicable; NDC posture is not applicable.

    Two governance failures are worth recording because they bear directly on how much
    a consumer can rely on the published contract. The developer portal's Terms and
    Conditions page (https://developer.heathrow.com/terms-and-conditions, HTTP 200) is
    verbatim boilerplate for a different website - it opens "These terms and conditions
    ('Terms') govern your viewing and use of this website http://careers.heathrow.com/"
    - so there are no API terms of service at all. And the portal's Privacy page
    (https://developer.heathrow.com/privacy, HTTP 200) is unedited Lorem ipsum
    placeholder text. The API changelog page renders empty.
