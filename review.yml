switchingCost:
  interfaceShape:
    value: proprietary-documented
    standardsNamed:
      - name: IATA and ICAO location and airline coding
        where: Airport identity (IATA LHR / ICAO EGLL) and the Weather API's documented
          "weather by iatacode" lookup
        status: used as data values, not as a published interface contract
      - name: OData
        where: https://api-dp-prod.dp.heathrow.com/enterprisesearch/prod/odata/flights
          and /odata/web, referenced from the heathrow.com page source
        status: an open query protocol is in use on the undocumented website backend,
          but the resource model behind it is unpublished and the host returns 403
      - name: Microsoft Entra ID / Azure Active Directory
        where: developer.heathrow.com sign-in
        status: implemented; governs authentication only, and does not make the data
          interface portable
      - name: Mutual TLS (client certificate authentication)
        where: api.heathrow.com and apimgmt.lhr.aero Azure Application Gateway
        status: enforced; "400 No required SSL certificate was sent"
    standardsAbsent:
      - IATA NDC - no relevance, Heathrow distributes no inventory
      - OpenTravel / OTA - no reference found
      - HTNG - not applicable
      - ACRIS Semantic Model (ACI's airport data standard) - no reference found
        anywhere on heathrow.com or developer.heathrow.com
      - A-CDM public data-sharing interface - none published
      - OpenAPI, AsyncAPI, GraphQL, JSON Schema - none published or retrievable
        anonymously
    evidence: Heathrow publishes prose product descriptions but no machine-readable
      contract, no endpoint reference, no versioning policy and no changelog entries.
      The response shapes for Flights, Connections and Weather are bespoke to Heathrow
      and are not described against any industry schema. A consumer integrates against
      a shape they can only see after enrolment, and cannot diff, mock or code-generate
      before signing up.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
      - name: OAG
        note: Commercial flight schedules, status and connections in RESTful JSON; LHR
          fully covered. The nearest functional substitute for both the Flights and the
          Connections products.
      - name: Cirium (FlightStats)
        note: Same class - schedules, status, connections, minimum connect times.
      - name: FlightAware AeroAPI
        note: Query-based flight tracking and status covering LHR movements.
      - name: aviationstack / FlightLabs / Flightradar24
        note: Commercial aggregators reselling LHR movement data.
      - name: Met Office DataHub, OpenWeather, Open-Meteo, AccuWeather
        note: The Weather product is the weakest lock-in of the three. Airport weather
          by IATA code is a commodity available from many providers, several of them
          free, and Heathrow is not the authoritative source for weather at other
          airports.
      - name: EUROCONTROL NM B2B / UK CAA published data
        note: Regulatory and network sources for movement and slot data, but on
          entirely different access terms.
    reasoning: For flight schedule and status, real substitutes exist - but they are a
      different commercial relationship, a different data model and a paid contract, so
      moving is a project rather than a swap. For anything only the airport operator
      holds, there is no second source at all - Heathrow-specific terminal and gate
      assignment, intra-airport transfer and connection timing between LHR terminals,
      security and immigration wait times, and points of interest inside the campus.
      And for physical access to Heathrow's runways and stands there is no alternative
      in the London hub market - Gatwick, Stansted and Luton are different airports
      serving different networks, not a second source for LHR.
  exitPath:
    value: export-on-request
    operationCited: null
    detail: No export, dump, bulk or data-portability operation is documented, because
      no endpoint reference is published at all. The portal exposes a /reports page in
      its sitemap, but that is Azure API Management's standard consumer analytics view,
      is only reachable authenticated, and reports usage - not data. The only
      implemented portability commitment is the statutory one.
    verbatim: >-
      "Under the General Data Protection Regulation, you have the right to: Access your
      personal data by making a subject access request; Rectification, erasure or
      restriction of your information where this is justified; Object to the processing
      of your information where this is justified; Data portability"
    channel: Data Protection Officer, Heathrow Airport Limited, The Compass Centre,
      Nelson Road, Hounslow, Middlesex TW6 2GW. Email privacy@heathrow.com. Complaints
      escalate to the UK Information Commissioner.
    note: This is an individual privacy right under the UK GDPR, not a data-portability
      mechanism for an integrator. A developer who built on the Flights or Connections
      API and wanted out would have nothing to export - they never held a store, only a
      live feed - and would face the harder problem of re-modelling every response
      shape against a replacement provider.
  identifierPortability:
    value: IATA and ICAO codes travel; the flight record key and the terminal model do
      not
    detail: Portable identifiers documented or observed - IATA airport code LHR and
      ICAO code EGLL for the airport itself; IATA airline designators and aircraft
      types, named on the Flights API page; IATA code lookup, named explicitly on the
      Weather API page ("Weather by iatacode"). Non-portable identifiers - an opaque
      internal flight identifier surfaced as the flightIds query parameter, which
      heathrow.com's own robots.txt disallows crawling (the rule reads "Disallow"
      then "/*?flightIds=*"),
      and Heathrow's terminal model (T2/T3/T4/T5 plus the flight-to-terminal and
      terminal-to-terminal connection query shapes), which is meaningful only at
      Heathrow and has no cross-airport equivalent. There is no PNR or record locator,
      no IATA/ARC agency number, no GDS record ID, no hotel chain code and no GIATA ID
      anywhere in the surface, because Heathrow never touches a booking.
  contractualLockIn:
    value: no API terms of service published at all; the website terms prohibit
      systematic downloading into a database
    entity: Heathrow Airport Limited, The Compass Centre, Nelson Road, Hounslow,
      Middlesex TW6 2GW. The developer portal footer credits LHR Airports Limited, a
      private limited company registered in England under Company Number 1970855.
    verbatim:
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 5.5.2 - no systematic extraction into a database
        text: >-
          "You may not do any of the following without our written permission: ...
          create a database in electronic or structured manual form by systematically
          downloading and storing any content."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 5.2 - no reuse or derivative works
        text: >-
          "Except as stated in paragraph 7.4 below, without our prior written
          permission, you may not copy, reproduce, modify, alter, publish, broadcast,
          distribute, display, post, sell, transfer or transmit in any form or by any
          means any material on this Website or Software whether in whole or in part
          nor use the material or Software to create derivative works."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 5.3 - no caching or mirroring for third parties
        text: >-
          "The contents of the pages contained in this Website may not be distributed,
          displayed or copied to third parties including, but not limited to, 'caching'
          any material on this Website for access by third parties and 'mirroring' any
          material on this Website."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 5.4 - personal non-commercial use only
        text: >-
          "The contents of individual pages of this Website may be printed or
          downloaded to disk for the purpose of private and personal non-commercial
          use."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 4.2.6 - load limitation
        text: >-
          "you agree that you will not: ... take any action that imposes an
          unreasonable or disproportionately large load on this Website or related
          infrastructure"
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 4.2.8 - no credential sharing
        text: >-
          "grant access to the Website to any third party or to any other user who
          already has access to the Website by providing or sharing usernames and/or
          passwords provided for your use."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 4.3 - termination at will on breach
        text: >-
          "We reserve the right to suspend or terminate your access and use of this
          Website at any time if you breach these Terms."
      - source: https://www.heathrow.com/terms-and-conditions
        clause: 11.1 - governing law
        text: >-
          "These Terms, its subject matter and its formation, are governed by English
          law. You and we both agree that the courts of England and Wales will have
          exclusive jurisdiction."
      - source: https://developer.heathrow.com/terms-and-conditions
        clause: the developer portal's own terms are boilerplate for another site
        text: >-
          "These terms and conditions ('Terms') govern your viewing and use of this
          website http://careers.heathrow.com/ (the 'Website') which is owned and
          operated by LHR Airports Limited."
        note: Quoted to establish that no API-specific terms of service exist. The
          adjacent /privacy page on the same portal is unedited Lorem ipsum.
    notPublished:
      - API terms of service or acceptable use policy
      - minimum term or commitment
      - exclusivity
      - pricing, per-call or per-segment fees
      - rate limits or quotas
      - service level agreement or uptime commitment
      - deprecation, versioning or breaking-change policy
      - termination notice period
      - data licence for API responses
    reading: Heathrow publishes documentation but not a contract. Because the API terms
      page was never written, an enrolled developer's obligations are defined by the
      general website terms - which forbid systematically downloading content into a
      database, forbid caching for third parties, and permit only private
      non-commercial use. Read literally, the published terms are in tension with the
      portal's own stated purpose, which invites developers to "combine this API with
      other APIs ... to create valuable products". The real commercial terms are
      presumably settled in the unpublished enrolment conversation with
      support@heathrow.com, which means they cannot be evaluated before you commit.
  distributionModel:
    value: not-applicable
    ndcPosture: Not applicable. Heathrow is an airport operator, not a carrier or an
      agency. It holds no bookable inventory, files no fares, issues no tickets or
      PNRs, has no IATA NDC certification level to claim, publishes no NDC endpoint,
      and levies no GDS surcharge. Airlines distribute through their own channels and
      pay Heathrow aeronautical charges for use of the infrastructure; slot allocation
      at LHR sits with Airport Coordination Limited under the UK slot regulations, not
      with a distribution system. Heathrow's own economic terms are set through UK
      Civil Aviation Authority economic regulation, not through commercial distribution
      agreements.
    revenue: aeronautical charges, retail concessions, car parking and ground
      transport, and property.
  accessGate:
    value: application-approval
    developerMustSign: |
      Three gates in sequence, all of them human or organisational, none self-serve.
      (1) Contact and justify. Per developer.heathrow.com/how-it-works, a prospective
      developer must email support@heathrow.com or call 08443351801 and state "what
      type of user you are and why you want to use the APIs" before access is granted.
      (2) Enrolment and identity. Heathrow then runs an "enrolling process", after which
      the account is authenticated through Microsoft Entra ID / Azure Active Directory -
      "Sign in using your Azure Active Directory credentials." The product tier is
      chosen during enrolment, not in the portal.
      (3) Client certificate. The runtime gateway at api.heathrow.com enforces mutual
      TLS and rejects any call without one - "400 No required SSL certificate was sent".
      The portal's sitemap carries a /documentation/requesting-a-client-certificate
      page for this, but the page 404s.
      No API terms of service, data licence, pricing sheet or SLA is published for a
      developer to read before entering that process.
    portalConfirmed: false
    portalUrl: https://developer.heathrow.com/
    portalNote: The portal is live and returns HTTP 200, and it is genuinely Heathrow's
      own developer portal rather than a partner login shell - it publishes three public
      product pages. It is recorded as not confirmed only against the stricter test of a
      self-serve portal - there is no anonymous key issue, no interactive try-it, no
      visible API catalogue and no self-registration.
  agentReadiness:
    llmsTxt: none - /llms.txt returns 404 on both www.heathrow.com and
      developer.heathrow.com
    mcp: none published
    note: No OpenAPI means no agent can be generated against these APIs without first
      being enrolled, and no machine-readable terms exist for an agent to check before
      calling.
