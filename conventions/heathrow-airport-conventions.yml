description: >-
  Cross-cutting request/response semantics for the Heathrow API programme. Most
  fields below are null, and that is the finding: Heathrow documents the
  business value of three API products in prose but publishes no technical
  contract at all - no base path, no parameters, no response shape, no error
  envelope, no pagination, no idempotency, no versioning and no rate limits.
  Everything a developer needs to write code is visible only after a manual
  enrolment and a Microsoft Entra ID account. The only cross-cutting semantics
  observable from outside are the two access gates.

base_url: https://api.heathrow.com
base_url_confidence: >-
  The host is confirmed as Heathrow's Azure Application Gateway - it answers on
  TLS and returns "400 No required SSL certificate was sent" for every path -
  but no base path, route prefix or product path is published, so the URL is the
  gateway root only.
api_style: >-
  Not published. The three products (Flights, Flight Connections, Weather) are
  described as request/response APIs returning flight, connection and weather
  data, which implies REST over HTTPS with JSON, but no media type, path or
  method is documented anonymously.

authentication:
  scheme: Mutual TLS at the gateway (client certificate) + Microsoft Entra ID for the developer portal
  self_service: false
  detail: authentication/heathrow-airport-authentication.yml
  docs: https://developer.heathrow.com/how-it-works
  evidence: >-
    "400 No required SSL certificate was sent" from
    Microsoft-Azure-Application-Gateway/v2 at api.heathrow.com; "Sign in using
    your Azure Active Directory credentials" at developer.heathrow.com/signin.

idempotency:
  supported: unknown
  mechanism: null
  docs: null
  note: >-
    No idempotency key, header, scope or retention window is documented, and
    there is no OpenAPI to inspect for an Idempotency-Key parameter. No
    Idempotency pointer is emitted in apis.yml - doing so without evidence would
    be fabrication. The three published products are read-oriented (flight,
    connection and weather lookups), where idempotency matters least.

