  - name: Flight Connections
    page: https://developer.heathrow.com/api-connections
    documented_query_shapes: [flight to flight, flight to terminal, terminal to terminal, terminal to flight]
  - name: Weather
    page: https://developer.heathrow.com/api-weather
    documented_data: [temperature, weather categories, countries list, weather by iatacode]
    verbatim: >-
      "Our API is updated multiple times at day and it gives you a reliable
      service to get weather information worldwide."

other_conventions:
  - name: Access gate
    detail: >-
      Two gates, both manual. Enrolment by email/phone to support@heathrow.com /
      08443351801, then a Microsoft Entra ID account; separately a
      Heathrow-issued client certificate for the runtime gateway. See
      authentication/heathrow-airport-authentication.yml.
  - name: Product entitlement
    detail: Entitlement is chosen during enrolment, not self-served from the portal - /products renders empty anonymously.
  - name: Identifiers
    detail: >-
      IATA/ICAO codes are the portable identifiers (LHR / EGLL, airline
      designators, "Weather by iatacode"). Heathrow's terminal model (T2-T5) and
      the opaque internal flightIds parameter used on heathrow.com are not
      portable across airports.
  - name: No API terms of service
    detail: >-
      developer.heathrow.com/terms-and-conditions is verbatim boilerplate
      governing careers.heathrow.com, and developer.heathrow.com/privacy is
      unedited Lorem ipsum. The only enforceable terms are the general website
      terms at heathrow.com/terms-and-conditions, which prohibit systematic
      downloading into a database.
